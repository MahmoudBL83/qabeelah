# Example Nginx config for a single custom domain
# Replace family.example.com and backend address appropriately

server {
  listen 80;
  server_name family.example.com;

  # Serve ACME challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect other HTTP to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name family.example.com;

  ssl_certificate /etc/letsencrypt/live/family.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/family.example.com/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:4000; # Qabila backend
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Optional: serve verification file from disk
  location /.well-known/qabila-domain-verification.txt {
    alias /var/www/qabila/.well-known/qabila-domain-verification.txt;
  }
}
